<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>для тебя</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Marck+Script&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Cormorant Garamond', Georgia, serif;
}

#stage {
  position: fixed;
  inset: 0;
  background: #000;
  overflow: hidden;
  transition: filter 3s ease;
}

#stage.fade-end {
  filter: brightness(0.35);
}

#glow {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 60vmin;
  height: 60vmin;
  transform: translate(-50%, -50%) scale(0.6);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,90,120,0.35) 0%, rgba(255,90,120,0.12) 40%, rgba(0,0,0,0) 70%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 2.5s ease, transform 3s ease;
  filter: blur(2px);
}

#glow.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

#scene {
  position: absolute;
  inset: 0;
  transform: scale(1.35);
  transform-origin: 50% 50%;
  transition: transform 2.6s cubic-bezier(0.22, 1, 0.36, 1);
}

#scene.zoom-out {
  transform: scale(1);
}

#scene.heartbeat {
  animation: heartbeat 1.1s ease-in-out infinite;
}

@keyframes heartbeat {
  0%   { transform: scale(1); }
  25%  { transform: scale(1.035); }
  45%  { transform: scale(1); }
  60%  { transform: scale(1.02); }
  100% { transform: scale(1); }
}

.word {
  position: absolute;
  top: 0;
  left: 0;
  transform: translate(-50%, -50%) scale(0);
  color: #ffe6ec;
  font-size: clamp(1.4rem, 3.4vmin, 2.6rem);
  font-weight: 600;
  white-space: nowrap;
  text-shadow: 0 0 12px rgba(255,120,150,0.85), 0 0 26px rgba(255,80,120,0.4);
  opacity: 0;
  pointer-events: none;
  transition: left 2.3s cubic-bezier(0.22, 1, 0.36, 1),
              top 2.3s cubic-bezier(0.22, 1, 0.36, 1),
              font-size 1.8s ease,
              text-shadow 1.8s ease,
              color 1.8s ease;
}

.word.pop {
  animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes popIn {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0); }
  60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.word.collected {
  font-size: clamp(0.85rem, 1.7vmin, 1.15rem);
  color: #ffd2de;
  text-shadow: 0 0 8px rgba(255,140,170,0.9), 0 0 18px rgba(255,90,130,0.5);
}

#start-overlay {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: opacity 1s ease;
}

#start-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

#start-inner {
  text-align: center;
}

.start-heart {
  color: #ff5c7a;
  font-size: 3rem;
  margin-bottom: 1.6rem;
  text-shadow: 0 0 20px rgba(255,90,120,0.8);
  animation: heartbeat 1.4s ease-in-out infinite;
}

#start-btn {
  background: transparent;
  border: 1px solid rgba(255,200,210,0.5);
  color: #ffe6ec;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.15rem;
  letter-spacing: 0.05em;
  padding: 0.85rem 2.2rem;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.3s ease, border-color 0.3s ease;
}

#start-btn:hover {
  background: rgba(255,120,150,0.15);
  border-color: rgba(255,200,210,0.9);
}

</style>
</head>
<body>

  <div id="stage">
    <div id="glow"></div>
    <div id="scene"></div>
  </div>

  <div id="start-overlay">
    <div id="start-inner">
      <div class="start-heart">♥</div>
      <button id="start-btn">нажми, чтобы начать</button>
    </div>
  </div>

const WORD_TEXTS = ["Ты","моя","самая","милая","и","любящая","девушка","любимая","единственная","лучшая","милая","заботливая","мээн чаражым","волшебная","вдохновляющая","спокойная","мээн кызым","сеткилим","весёлая","солнечная","дангынам","ласковая","верная","настоящая","особенная","бесценная","любящая","прекрасная","потрясающая","гармоничная","обаятельная","живая","яркая","очаровательаня","ынаам","добросердечная","естественная","редкая","драгоценная","моя радость","моё счастье","моя вселенная","мой свет","моя музыка","моя весна","моя сказка","моё чудо","моя гордость","моя опора","моя половинка","моё вдохновение","Ынак эжим"];

const WORDS = WORD_TIMES.map((t, i) => ({ t, text: WORD_TEXTS[i] }));

const COLLECT_START = 15.0;   // когда начинаем стягивать слова в сердце
const COLLECT_DONE  = COLLECT_START + 2.6;
const FADE_TIME     = 34;    // синхронно с затуханием аудио
const SONG_END      = 37;

const scene   = document.getElementById('scene');
const stage   = document.getElementById('stage');
const glow    = document.getElementById('glow');
const audio   = document.getElementById('bgm');
const overlay = document.getElementById('start-overlay');
const startBtn= document.getElementById('start-btn');

let wordEls = [];
let spawned = new Array(WORDS.length).fill(false);
let collecting = false;
let collected = false;
let faded = false;
let rafId = null;

function heartPoint(i, total, cx, cy, scale) {
  const t = (i / total) * Math.PI * 2;
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return {
    x: cx + x * scale,
    y: cy - y * scale
  };
}

function randomStart(cx, cy, isFirst) {
  if (isFirst) {
    return { x: cx, y: cy };
  }
  const minDim = Math.min(window.innerWidth, window.innerHeight);
  const radius = minDim * 0.24;
  const r = Math.sqrt(Math.random()) * radius;
  const angle = Math.random() * Math.PI * 2;
  return {
    x: cx + Math.cos(angle) * r,
    y: cy + Math.sin(angle) * r
  };
}

function buildWords() {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  WORDS.forEach((w, i) => {
    const el = document.createElement('div');
    el.className = 'word';
    el.textContent = w.text;
    const pos = randomStart(cx, cy, i === 0);
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    scene.appendChild(el);
    wordEls.push(el);
  });
}

function spawnWord(i) {
  const el = wordEls[i];
  el.classList.add('pop');
  el.style.opacity = 1;
}

function collectIntoHeart() {
  collecting = true;
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const minDim = Math.min(window.innerWidth, window.innerHeight);
  const scale = minDim * 0.021;

  glow.classList.add('show');
  scene.classList.add('zoom-out');

  wordEls.forEach((el, i) => {
    const p = heartPoint(i, wordEls.length, cx, cy, scale);
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.classList.add('collected');
  });

  setTimeout(() => {
    scene.classList.add('heartbeat');
    collected = true;
  }, 2500);
}

function tick() {
  const t = audio.currentTime;

  WORDS.forEach((w, i) => {
    if (!spawned[i] && t >= w.t) {
      spawned[i] = true;
      spawnWord(i);
    }
  });

  if (!collecting && t >= COLLECT_START) {
    collectIntoHeart();
  }

  if (!faded && t >= FADE_TIME) {
    faded = true;
    stage.classList.add('fade-end');
  }

  if (t >= SONG_END) {
    audio.pause();
    cancelAnimationFrame(rafId);
    return;
  }

  rafId = requestAnimationFrame(tick);
}

function start() {
  overlay.classList.add('hidden');
  buildWords();
  audio.currentTime = 0;
  audio.play();
  rafId = requestAnimationFrame(tick);
}

startBtn.addEventListener('click', start, { once: true });

</script>
</body>
</html>
